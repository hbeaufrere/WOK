<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wheel of Knowledge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .wheel-container {
            position: relative;
            width: 400px;
            height: 400px;
            margin-bottom: 30px;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }

        .wheel-segment {
            position: absolute;
            width: 50%;
            height: 50%;
            top: 0;
            right: 0;
            transform-origin: bottom left;
            display: flex;
            align-items: center;
            justify-content: center;
            clip-path: polygon(0 100%, 100% 0, 100% 100%);
        }

        .wheel-segment span {
            position: absolute;
            font-size: 11px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            transform: rotate(22.5deg) translateX(60px);
            white-space: nowrap;
            text-align: center;
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #e74c3c;
            z-index: 10;
            filter: drop-shadow(0 3px 3px rgba(0, 0, 0, 0.3));
        }

        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: linear-gradient(145deg, #f5f5f5, #e0e0e0);
            border-radius: 50%;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            z-index: 5;
        }

        .spin-button {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(145deg, #e74c3c, #c0392b);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.4);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .spin-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.5);
        }

        .spin-button:active {
            transform: translateY(0);
        }

        .spin-button:disabled {
            background: linear-gradient(145deg, #95a5a6, #7f8c8d);
            cursor: not-allowed;
            box-shadow: none;
        }

        .result {
            margin-top: 30px;
            padding: 20px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
            background-color: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .result.show {
            opacity: 1;
        }

        /* Segment colors */
        .segment-0 { background-color: #3498db; } /* Dr. Guzman - Blue */
        .segment-1 { background-color: #f39c12; } /* Ask a question - Orange */
        .segment-2 { background-color: #9b59b6; } /* Dr. Beaufrère - Purple */
        .segment-3 { background-color: #1abc9c; } /* Ask a question - Teal */
        .segment-4 { background-color: #e74c3c; } /* Dr. Keller - Red */
        .segment-5 { background-color: #2ecc71; } /* Ask a question - Green */
        .segment-6 { background-color: #e91e63; } /* Dr. Hawkins - Pink */
        .segment-7 { background-color: #00bcd4; } /* Ask a question - Cyan */
    </style>
</head>
<body>
    <h1>The Wheel of Knowledge</h1>

    <div class="wheel-container">
        <div class="pointer"></div>
        <div class="wheel" id="wheel"></div>
        <div class="center-circle"></div>
    </div>

    <button class="spin-button" id="spinButton">MAKE STUDENTS LEARN</button>

    <div class="result" id="result"></div>

    <script>
        const segments = [
            "Dr. Guzman",
            "Ask a question",
            "Dr. Beaufrère",
            "Ask a question",
            "Dr. Keller",
            "Ask a question",
            "Dr. Hawkins",
            "Ask a question"
        ];

        const wheel = document.getElementById('wheel');
        const spinButton = document.getElementById('spinButton');
        const resultDiv = document.getElementById('result');

        let currentRotation = 0;
        let isSpinning = false;

        // Create wheel segments
        function createWheel() {
            const segmentAngle = 360 / segments.length;

            segments.forEach((segment, index) => {
                const div = document.createElement('div');
                div.className = `wheel-segment segment-${index}`;
                div.style.transform = `rotate(${index * segmentAngle - 90}deg)`;

                const span = document.createElement('span');
                span.textContent = segment;
                div.appendChild(span);

                wheel.appendChild(div);
            });
        }

        // Spin the wheel
        function spinWheel() {
            if (isSpinning) return;

            isSpinning = true;
            spinButton.disabled = true;
            resultDiv.classList.remove('show');

            // Random rotation between 5-10 full spins plus random segment
            const spinAmount = 1800 + Math.random() * 1800 + Math.random() * 360;
            currentRotation += spinAmount;

            wheel.style.transform = `rotate(${currentRotation}deg)`;

            // Calculate result after spin
            setTimeout(() => {
                const normalizedRotation = currentRotation % 360;
                const segmentAngle = 360 / segments.length;
                // Pointer is at top (0 degrees), wheel rotates clockwise
                // We need to find which segment is at the top
                const winningIndex = Math.floor((360 - normalizedRotation + segmentAngle / 2) / segmentAngle) % segments.length;

                resultDiv.textContent = segments[winningIndex];
                resultDiv.classList.add('show');

                isSpinning = false;
                spinButton.disabled = false;
            }, 4000);
        }

        // Initialize
        createWheel();
        spinButton.addEventListener('click', spinWheel);
    </script>
</body>
</html>
